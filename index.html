<style>
html { background: radial-gradient(120% 90% at 50% 42%, #1a1a1c 0%, #0b0b0c 62%, #000 100%); min-height: 100%; }
#w {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #ff2b3a; font-size: 60px; line-height: 1;
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  animation: beat 1.5s ease-in-out infinite;
}
@keyframes beat {
  0%, 72%, 100% { transform: scale(1); }
  12% { transform: scale(1.3); }
  26% { transform: scale(1); }
  38% { transform: scale(1.22); }
}
@media (prefers-reduced-motion: reduce) { #w { animation: none; } }

<body>
<div id="w">&#9829;&#xFE0E;</div>
<script>
(function () {
  var K = 2562869194;
  function unscramble(buf, k) {
    var b = new Uint8Array(buf), s = k, i;
    for (i = 0; i < b.length; i++) {
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      b[i] = b[i] ^ (s & 255);
    }
    return b;
  }
  function load(key, stamp) {
    return fetch('l-' + stamp + '.bin').then(function (r) {
      if (!r.ok) throw 0;
      return r.arrayBuffer();
    }).then(function (buf) {
      var html = new TextDecoder('utf-8').decode(unscramble(buf, key));
      if (html.lastIndexOf('<!doctype', 0) !== 0) throw 0;
      document.open();
      document.write(html);
      document.close();
    });

     be handed a stale one and shown the previous build in full. This file is
     fetched with no-store, so it is always current, and it names the build to
     load — which means even a stale loader renders the newest letter. */
  fetch('v.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (v) { return load(v && v.k ? v.k : K, v && v.s ? v.s : '0ed63011b7'); })
    .catch(function () {
      document.getElementById('w').textContent = '\u2665\uFE0E\u2026';
    });
})();
</script>
