<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffeef3">
<title>&#128140;</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
<style>
html { background: linear-gradient(160deg,#ffeef3,#fff7f0 55%,#ffe9ef); min-height: 100%; }
#w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 54px; animation: b 1.3s ease-in-out infinite; }
@keyframes b { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@media (prefers-reduced-motion: reduce) { #w { animation: none; } }
</style>
</head>
<body>
<div id="w">&#128140;</div>
<script>
(function () {
  var K = 3491407247;
  function unscramble(buf) {
    var b = new Uint8Array(buf), s = K, i;
    for (i = 0; i < b.length; i++) {
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      b[i] = b[i] ^ (s & 255);
    }
    return b;
  }
  fetch('l.bin').then(function (r) {
    if (!r.ok) throw 0;
    return r.arrayBuffer();
  }).then(function (buf) {
    var html = new TextDecoder('utf-8').decode(unscramble(buf));
    document.open();
    document.write(html);
    document.close();
  }).catch(function () {
    document.getElementById('w').textContent = '\uD83D\uDC8C\u2026';
  });
})();
</script>
</body>
</html>
